# The Nodalia apps the launcher offers.
# Compiled by build.rs into `SUITE` and `DETAILS`. Text is English: the UI translates it by app id.
# Colours come from NDL's per-app accents (nodalia-design, tokens): `color` is the light accent,
# `ink_light` / `ink_dark` the accent as text on a light / dark surface.

[[apps]]
id = "letra"
name = "Letra"
suite = "office"
tagline = "Writing and document design"
color = [25, 122, 192]
ink_light = [18, 96, 153]
ink_dark = [115, 186, 247]
repo = "getnodalia/letra"
bundle = "dev.danielmiguelt.Letra"
mac_bundle_name = "Letra"
[apps.details]
headline = "The word processor that stays out of your way."
about = "Letters, reports and books in a fast native editor. It opens and saves DOCX and keeps your layout intact."

