name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmt, clippy, tests, layers and the wasm check (`cargo xtask ci`) on Linux; clippy and the tests
  # on Windows, where the code differs. No macOS here: the free macOS slots are kept for releases.
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@e756876881280ba136ec527be594f616c9a65a5a # foundation main 2026-11-14
    with:
      os: '["ubuntu-24.04","windows-latest"]'
      tools: ""
      # egui/winit/wgpu headers. The tray (ksni) and notifications are pure-Rust D-Bus clients, so
      # no GTK, appindicator or libdbus packages are needed.
      packages: pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      windows-command: |
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
  git-sources:
    uses: getnodalia/foundation/.github/workflows/git-sources.yml@4debdfe28cf5820d1748864efbd8d6996922d1ac # foundation main
  agents:
    uses: getnodalia/foundation/.github/workflows/agents-check.yml@e756876881280ba136ec527be594f616c9a65a5a # foundation main 2026-11-14
